[project]
name = "rag-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "bs4>=0.0.2",
    "fastapi>=0.139.0",
    "flashrank>=0.2.10",
    "langchain-google-genai>=4.2.7",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.8",
    "pdfplumber>=0.11.10",
    "pydantic>=2.0",
    "pydantic-settings>=2.16.3",
    "psycopg[binary]>=3.3.9",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "qdrant-client>=1.18.0",
    "requests>=2.32.0",
    "sentence-transformers>=5.6.0",
    "streamlit>=1.59.1",
    "unstructured>=0.24.0",
    "uvicorn[standard]>=0.51.0",
    "sqlalchemy>=2.1.9",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "langgraph-checkpoint-postgres>=3.2.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = ["pytest>=9.2.0"]
